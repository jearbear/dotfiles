[main]
font = JetBrains Mono:size=10
use-bold = yes
dpi-aware = yes
icons-enabled = no
show-actions = yes
terminal = "kitty --single-instance"
lines = 5
anchor = top
y-margin = 200
width = 40
horizontal-pad = 20
vertical-pad = 10
inner-pad = 10

[colors]
background = 181825ee
text = cdd6f4ff
prompt = cdd6f4ff
placeholder = cdd6f4ff
input = cdd6f4ff
match = cdd6f4ff
selection = 313244ff
selection-text = cdd6f4ff
selection-match = cdd6f4ff
border = cba6f7ff
border = fab387ff

[border]
width = 2
radius = 3
selection-radius = 2
